server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Docker may assign a new address when the PHP container is recreated.
    resolver 127.0.0.11 valid=5s ipv6=off;
    client_max_body_size 11m;
    error_page 413 = @payload_too_large;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location @payload_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"payload_too_large","message":"Файл превышает допустимый размер."}}';
    }

    # API requests always execute the single Slim front controller.
    location = /api {
        return 308 /api/;
    }

    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /app/backend/public;
        fastcgi_param HTTP_PROXY "";
        set $php_backend app:9000;
        fastcgi_pass $php_backend;
        fastcgi_read_timeout 65s;
        fastcgi_intercept_errors off;
    }

    location ~ (^|/)\. {
        deny all;
    }

    location ~ \.php$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
